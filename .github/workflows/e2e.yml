# End-to-end tests (docs/ci-cd-plan.md section 3.3, Phase 4; JUnit report from
# Phase 5).
# Starts the whole stack on the runner (seeded backend + production storefront)
# and runs Playwright against it. Kept off PRs because it's the slowest layer
# (CLAUDE.md); run it on a branch with "Run workflow" when needed.
# Actions are pinned to commit SHAs, as in ci.yml.
name: E2E

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *" # nightly, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same images and throwaway literals as integration-backend in ci.yml. The
    # services only live for this run.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medusa
          POSTGRES_PASSWORD: medusa
          POSTGRES_DB: medusa_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medusa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://medusa:medusa@localhost:5432/medusa_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret
      COOKIE_SECRET: ci-only-cookie-secret
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
      MEDUSA_BACKEND_URL: http://localhost:9000
      LOG_DIR: ${{ github.workspace }}/e2e-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-package
        with:
          package: backend
      - uses: ./.github/actions/setup-package
        with:
          package: storefront

      - name: Migrate and seed the database
        working-directory: backend
        env:
          SEED_PUBLISHABLE_KEY_FILE: ${{ runner.temp }}/publishable-key
        run: |
          npx medusa db:migrate
          npm run seed
          echo "MEDUSA_PUBLISHABLE_KEY=$(cat "$SEED_PUBLISHABLE_KEY_FILE")" >> "$GITHUB_ENV"

      # The production server runs from the build output, which holds the
      # built admin and its own package.json and lockfile.
      - name: Build the backend
        working-directory: backend
        run: |
          npm run build
          cd .medusa/server && npm ci --omit=dev

      - name: Start the backend on :9000
        working-directory: backend/.medusa/server
        env:
          NODE_ENV: production
        run: |
          mkdir -p "$LOG_DIR"
          nohup npx medusa start > "$LOG_DIR/backend.log" 2>&1 &

      - name: Build and start the storefront on :3000
        working-directory: storefront
        run: |
          npm run build
          nohup npm run start > "$LOG_DIR/storefront.log" 2>&1 &

      - name: Wait for both servers
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:9000/health > /dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://localhost:3000/ > /dev/null; do sleep 2; done'

      # Browsers are cached per Playwright version (pinned by the lockfile).
      # System libraries aren't cached, so a cache hit still installs those.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('storefront/package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: storefront
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: storefront
        run: npx playwright install-deps chromium

      - name: Run Playwright
        working-directory: storefront
        run: npm run test:e2e

      # JUnit XML from playwright.config.ts (CI only, docs/ci-cd-plan.md Phase 5).
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-e2e
          path: storefront/reports/junit/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload traces and server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure
          path: |
            storefront/test-results/
            e2e-logs/
          retention-days: 7
