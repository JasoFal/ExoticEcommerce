# PR checks (docs/ci-cd-plan.md, Phases 1-3; JUnit reports and Smart Tests
# recording from Phase 5).
# Most jobs are a matrix over both packages, so checks appear as
# "lint (backend)", "lint (storefront)", and so on. "integration-backend" is a
# single job. These names are the required status checks on the main ruleset
# (ci-cd-plan.md section 7).
# Actions are pinned to commit SHAs; Dependabot keeps the pins and their
# version comments current (.github/dependabot.yml).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token. Jobs ask for more only when they need it.
permissions:
  contents: read

# Cancel superseded PR runs. Runs on main always finish, so every main commit
# has a complete record for docs/ci-metrics.md.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [backend, storefront]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-package
        with:
          package: ${{ matrix.package }}
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [backend, storefront]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-package
        with:
          package: ${{ matrix.package }}
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [backend, storefront]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    # Only whether the token exists, so the secret itself reaches the Smart
    # Tests step alone. Empty on fork and Dependabot PRs.
    env:
      HAS_SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN != '' }}
    steps:
      # Full history for Smart Tests' commit collection.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-package
        with:
          package: ${{ matrix.package }}
      - run: npm test
      # JUnit XML from the test configs (CI only, docs/ci-cd-plan.md Phase 5).
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-unit-${{ matrix.package }}
          path: ${{ matrix.package }}/reports/junit/
          if-no-files-found: warn
          retention-days: 7
      # Profile and report come from expressions, not matrix keys, so the
      # required check names stay "unit (backend)" and "unit (storefront)".
      - name: Record in Smart Tests
        if: ${{ !cancelled() && env.HAS_SMART_TESTS_TOKEN == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/smart-tests-record
        with:
          profile: ${{ matrix.package == 'backend' && 'jest' || 'vitest' }}
          test-suite: unit-${{ matrix.package }}
          report: ${{ matrix.package }}/reports/junit/${{ matrix.package == 'backend' && 'unit' || 'vitest' }}.xml
          token: ${{ secrets.SMART_TESTS_TOKEN }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [backend, storefront]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-package
        with:
          package: ${{ matrix.package }}
      - run: npm run build

  # Backend integration tests (docs/ci-cd-plan.md section 3.1). The credentials
  # below are throwaway literals: the services only live for this run.
  integration-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medusa
          POSTGRES_PASSWORD: medusa
          POSTGRES_DB: medusa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medusa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: medusa
      DB_PASSWORD: medusa
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret
      COOKIE_SECRET: ci-only-cookie-secret
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
      HAS_SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-package
        with:
          package: backend
      - run: npm run test:integration:http
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-integration-backend
          path: backend/reports/junit/
          if-no-files-found: warn
          retention-days: 7
      - name: Record in Smart Tests
        if: ${{ !cancelled() && env.HAS_SMART_TESTS_TOKEN == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/smart-tests-record
        with:
          profile: jest
          test-suite: integration-backend
          report: backend/reports/junit/integration-http.xml
          token: ${{ secrets.SMART_TESTS_TOKEN }}
      # The runner creates and drops its own temporary databases
      # (medusa-<id>-integration-<n>). None should be left behind.
      - name: Check no test databases remain
        if: always()
        env:
          PGPASSWORD: medusa
        run: |
          left=$(psql -h localhost -U medusa -d postgres -Atc \
            "select datname from pg_database where datname like 'medusa-%-integration-%'")
          if [ -n "$left" ]; then
            echo "Leftover test databases:"
            echo "$left"
            exit 1
          fi
